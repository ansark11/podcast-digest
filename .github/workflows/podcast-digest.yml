name: Podcast Digest

on:
  schedule:
    # Fridays at 9am Eastern. GitHub cron is UTC-only, so both offsets are
    # scheduled (13:00 UTC = 9am EDT, 14:00 UTC = 9am EST) and the gate job
    # below lets through only the one that matches the current season.
    - cron: "0 13 * * 5"
    - cron: "0 14 * * 5"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

# Never run two at once: both would pick the same episodes and push.
concurrency:
  group: podcast-digest
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        # Compares against the schedule that fired rather than the clock, so a
        # run GitHub starts late still counts.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(TZ=America/Toronto date +%Z)" = "EDT" ]; then want="0 13 * * 5"; else want="0 14 * * 5"; fi
          if [ "${{ github.event.schedule }}" = "$want" ]; then run=true; else run=false; fi
          echo "Fired: '${{ github.event.schedule }}', 9am Eastern today is '$want' -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  run-digest:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the new summaries back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (needed to split long episodes)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Summarize episodes from the last 2 weeks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/podcast_digest.py

      # Summaries and transcripts are committed so they persist between runs
      # (the runner's disk is wiped). The push to main is what makes Vercel
      # rebuild the web app with the new summaries.
      - name: Commit new summaries and transcripts
        if: always()
        run: |
          git config user.name "podcast-digest-bot"
          git config user.email "actions@github.com"
          git add summaries/ transcripts/
          git diff --staged --quiet && exit 0
          git commit -m "Add podcast summaries"
          git pull --rebase
          git push
