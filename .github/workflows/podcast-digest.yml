name: Podcast Digest

# The weekly schedule runs on a Mac (scripts/scheduler/), not here: Substack
# returns 403 to GitHub's runners, so this fails for Substack-hosted shows
# like Lenny's Podcast. Kept as a manual run for shows hosted elsewhere.
on:
  workflow_dispatch: {}

# Never run two at once: both would pick the same episodes and push.
concurrency:
  group: podcast-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the new summaries back
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (needed to split long episodes)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Summarize episodes from the last 2 weeks
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/podcast_digest.py

      # Summaries and transcripts are committed so they persist between runs
      # (the runner's disk is wiped). The push to main is what makes Vercel
      # rebuild the web app with the new summaries.
      - name: Commit new summaries and transcripts
        if: always()
        run: |
          git config user.name "podcast-digest-bot"
          git config user.email "actions@github.com"
          git add summaries/ transcripts/
          git diff --staged --quiet && exit 0
          git commit -m "Add podcast summaries"
          git pull --rebase
          git push
